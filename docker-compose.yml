# ── AgriSetu Local Dev Stack ──
# Brings up: PostgreSQL+PostGIS+pgvector, Redis, Backend
# Frontend runs separately via `npm run dev`.

services:
  # ── Database ────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: agrisetu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend ─────────────────────────────────────────────────
  backend:
    build:
      context: ./agrisetu-backend
      target: runtime
    ports:
      - "8000:8000"
    env_file:
      - ./agrisetu-backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: https://placeholder.supabase.co
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./agrisetu-backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
