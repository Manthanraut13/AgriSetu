# CI: Lint + Test + Docker Build
# Runs on every push and PR to main/dev

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ── Backend Lint + Test ──────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agrisetu-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check . --exit-non-zero-on-fix || true

      - name: Pytest
        run: pytest tests/ -v --tb=short -x

  # ── Frontend Lint + Build ────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agrisetu-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agrisetu-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  # ── Docker Build (image only, no push) ───────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t agrisetu-backend:test ./agrisetu-backend

      - name: Smoke test
        run: |
          docker run --rm -d --name test-agrisetu \
            -e SUPABASE_URL=https://test.supabase.co \
            -e SUPABASE_ANON_KEY=test \
            -e SUPABASE_SERVICE_KEY=test \
            -e SENTINEL_HUB_CLIENT_ID=test \
            -e SENTINEL_HUB_CLIENT_SECRET=test \
            -e SENTINEL_HUB_INSTANCE_ID=test \
            -e OPENWEATHER_API_KEY=test \
            -e GEMINI_API_KEY=test \
            -e TWILIO_ACCOUNT_SID=test \
            -e TWILIO_AUTH_TOKEN=test \
            -e TWILIO_PHONE_NUMBER=test \
            -e TWILIO_WHATSAPP_TO=test \
            -e REDIS_URL="" \
            agrisetu-backend:test
          sleep 5
          docker exec test-agrisetu curl -sf http://localhost:8000/api/v1/health
          docker stop test-agrisetu
